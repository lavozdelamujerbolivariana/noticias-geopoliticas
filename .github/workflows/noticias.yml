name: Recopilar Noticias Geopolíticas

on:
  schedule:
    # Se ejecuta todos los días a las 6:00 AM hora de Venezuela (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar cosechador de noticias
        run: |
          python - << 'EOF'
          import os
          import json
          import time
          from datetime import datetime
          import requests
          from bs4 import BeautifulSoup
          import urllib3

          # Desactivar advertencias de certificados SSL inseguros en sitios del estado
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          ARCHIVO_JSON = "noticias.json"

          FUENTES_GEOPOLITICAS = [
              {"nombre": "Ministerio de Comunas", "url": "https://www.comunas.gob.ve/"},
              {"nombre": "Mippci Medios Comunitarios", "url": "https://mippci.gob.ve/category/medios-comunitarios/"},
              {"nombre": "Correo del Orinoco", "url": "https://www.correodelorinoco.gob.ve/"},
              {"nombre": "El Mazo Dando", "url": "https://mazo4f.com/"},
              {"nombre": "VTV", "url": "https://vtv.com.ve/"},
              {"nombre": "RNV", "url": "https://rnv.gob.ve/"},
              {"nombre": "Radio Mundial", "url": "https://radiomundial.com.ve/"},
              {"nombre": "La Radio del Sur", "url": "https://www.laradiodelsur.com.ve/"},
              {"nombre": "Ministerio de Cultura", "url": "https://www.mincultura.gob.ve/"},
              {"nombre": "Agencia Xinhua", "url": "https://spanish.xinhuanet.com/"},
              {"nombre": "RT en Español", "url": "https://actualidad.rt.com/"},
              {"nombre": "Telesur", "url": "https://www.telesurtv.net/"},
              {"nombre": "HispanTV", "url": "https://hispantv.com/"},
              {"nombre": "La Voz de Vietnam", "url": "https://vovworld.vn/es-ES"}
          ]

          def cargar_noticias_anteriores():
              """Recupera la memoria histórica previa del JSON agrupada o plana"""
              if os.path.exists(ARCHIVO_JSON):
                  try:
                      with open(ARCHIVO_JSON, 'r', encoding='utf-8') as f:
                          data = json.load(f)
                          # Compatibilidad si el JSON es un diccionario por medios o una lista plana
                          if isinstance(data, dict):
                              plana = []
                              for fuente, lista in data.items():
                                  for item in lista:
                                      item['fuente'] = fuente
                                      plana.append(item)
                              return plana
                          return data
                  except Exception:
                      return []
              return []

          def extraer_noticias_fuente(fuente):
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }
              noticias = []
              try:
                  res = requests.get(fuente["url"], headers=headers, timeout=10, verify=False)
                  if res.status_code != 200: 
                      return noticias
                  
                  soup = BeautifulSoup(res.text, 'html.parser')
                  enlaces = soup.find_all('a')
                   
                  for tag_a in enlaces:
                      enlace = tag_a.get('href')
                      if not enlace or len(enlace) < 5: 
                          continue
                      
                      # Reconstruir enlaces relativos
                      if enlace.startswith('/'):
                          base = fuente["url"].split("://")[0] + "://" + fuente["url"].split("://")[1].split("/")[0]
                          enlace = f"{base}{enlace}"
                      
                      titulo = tag_a.get_text().strip()
                      if len(titulo.split()) < 4 or titulo.lower() in ["leer más", "ver más", "contacto", "inicio"]: 
                          continue
                      
                      texto_evaluar = titulo.lower()
                      
                      # Palabras clave y filtros positivos
                      tiene_kw = any(kw in texto_evaluar for kw in [
                          "comuna", "comunal", "pueblo", "venezuela", "gobierno", "bolivariana", 
                          "cultural", "presidente", "social", "nacional", "rusia", "china", "brics",
                          "ciencia", "tecnologia", "conocimiento", "ecosocialismo", "socioproductivo",
                          "software libre", "turismo", "historia", "crónica", "cultura"
                      ])
                      
                      es_positiva = not any(neg in texto_evaluar for neg in ["asesinado", "crimen", "sucesos", "detenido", "homicidio"])
                      
                      if tiene_kw and es_positiva:
                          noticias.append({
                              "titulo": titulo,
                              "link": enlace,
                              "fuente": fuente["nombre"],
                              "fecha": datetime.now().strftime("%d/%m/%Y")
                          })
                          if len(noticias) >= 5: 
                              break
              except Exception as e:
                  print(f"⚠️ Error escaneando {fuente['nombre']}: {e}")
              return noticias

          # Proceso principal de cosecha
          print("🛰️ INICIANDO COSECHADOR DE NOTICIAS...")
          noticias_acumuladas = cargar_noticias_anteriores()
          enlaces_vistos = {n.get('link', n.get('enlace', '')) for n in noticias_acumuladas}
          
          nuevas_news = []
          for f in FUENTES_GEOPOLITICAS:
              print(f" -> Escaneando: {f['nombre']}...")
              news_fuente = extraer_noticias_fuente(f)
              print(f"    ✓ Encontradas {len(news_fuente)} notas válidas.")
              
              for n in news_fuente:
                  link_item = n['link']
                  if link_item not in enlaces_vistos:
                      nuevas_news.append(n)
                      enlaces_vistos.add(link_item)
              time.sleep(0.5)

          # Fusionar nuevas notas arriba del historial
          lista_final = nuevas_news + noticias_acumuladas

          # Reestructurar en formato de diccionario por medio para que tu widget HTML/JS funcione sin cambios
          resultado_por_medio = {f["nombre"]: [] for f in FUENTES_GEOPOLITICAS}
          for nota in lista_final[:100]: # Mantener un historial razonable de respaldo
              nombre_f = nota.get('fuente', 'General')
              if nombre_f in resultado_por_medio:
                  if len(resultado_por_medio[nombre_f]) < 5: # Máximo 5 por fuente
                      resultado_por_medio[nombre_f].append({
                          "titulo": nota["titulo"],
                          "link": nota.get("link", nota.get("enlace", ""))
                      })

          with open(ARCHIVO_JSON, "w", encoding="utf-8") as f:
              json.dump(resultado_por_medio, f, ensure_ascii=False, indent=2)
          print("📦 Archivo noticias.json actualizado con éxito.")
          EOF

      - name: Guardar y publicar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Actualización inteligente de noticias [6:00 AM]" || exit 0
          git pull origin main --rebase || true
          git push origin main
